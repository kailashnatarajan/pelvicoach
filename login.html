<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in – PelviCoach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%230e6f86' stroke-width='2.5' stroke-dasharray='4 3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%230e6f86'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-role="patient">
<header class="top"><div class="wrap">
  <a class="logo" href="index.html" aria-label="PelviCoach home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="16" cy="16" r="7" fill="var(--acc)"/></svg>PelviCoach</a>
  <nav><a href="index.html">Back to home</a></nav>
</div></header>

<main class="auth"><div class="panel">
  <div class="seg" role="group" aria-label="Account type">
    <button type="button" id="tabPatient" aria-pressed="true">Patient</button>
    <button type="button" id="tabClinician" aria-pressed="false">Clinician</button>
  </div>
  <h1 id="title">Patient sign in</h1>
  <p class="mut" id="sub">Sign in to see your exercises and progress.</p>

  <form id="form" novalidate>
    <div id="nameRow" hidden><label for="name">Full name</label><input id="name" autocomplete="name"></div>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="6" required>
    <div class="hint" id="pwHint" hidden>At least 6 characters.</div>
    <div id="codeRow" hidden><label for="code">Clinician access code</label><input id="code" autocomplete="off"><div class="hint">Given to you by the project team. It stops patients from creating clinician accounts.</div></div>
    <button class="btn" id="go" type="submit">Sign in</button>
  </form>
  <div class="note" id="msg" role="status" aria-live="polite" hidden></div>
  <p class="swap"><span id="swapText">New here?</span> <button type="button" id="swap">Create an account</button></p>
</div></main>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/backend.js"></script>
<script src="js/auth.js"></script>
<script>Auth.initLoginPage();</script>
</body>
</html>
